name: Android debug build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages (runner SDK, no setup-android action)
        shell: bash
        run: |
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKM  ANDROID_HOME: $ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build.log
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaMusic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Unit tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee test.log
      - name: Lint (report only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:lintDebug 2>&1 | tee lint.log
      - name: Record APK info
        if: always()
        shell: bash
        run: |
          if ls app/build/outputs/apk/debug/*.apk > /dev/null 2>&1; then
            ls -l app/build/outputs/apk/debug/*.apk | tee apk-info.txt
            sha256sum app/build/outputs/apk/debug/*.apk | tee -a apk-info.txt
          else
            echo "APK tidak dihasilkan - lihat build.log" | tee apk-info.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaMusic-build-reports
          path: |
            build.log
            test.log
            lint.log
            apk-info.txt
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
